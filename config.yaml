# ============================================================
# 跌倒检测系统统一配置：所有可调参数集中在这里
# ============================================================
paths:                                      # 外部文件路径
  ground_file: ground.yaml                  # 地面标定结果；相对路径以config.yaml目录为基准
models:                                     # YOLO模型与推理参数
  pose_model: yolo26s-pose.pt               # 人体框、17个关键点和Track ID使用的Pose模型
  scene_model: yolo26s-seg.pt               # 床、沙发、椅子使用的实例分割模型，必须返回Mask
  pose_conf: 0.45                           # 人体检测最低置信度，调低减少漏检但增加误检
  scene_conf: 0.35                          # 家具检测最低置信度，调低更容易检测遮挡家具
  scene_retina_masks: true                  # 是否输出精细Mask；true边缘更准但稍占显存
  tracker: botsort.yaml                     # 人体跟踪器，用于保持稳定Track ID
  scene_inference_interval_frames: 3        # 每隔多少帧运行一次家具Seg，调大更省算力

#--------------------------------------camera-------------------------------------#
camera:                                     # RGB-D取帧与标定一致性检查
  frame_timeout_ms: 1000                    # 正常运行等待一组帧的最长时间，单位毫秒
  first_frame_timeout_ms: 3000              # 启动时每次等待首帧的最长时间，单位毫秒
  first_frame_retries: 10                   # 首帧最大重试次数
  strict_ground_calibration: true           # 内参与标定不一致时是否禁止运行
  focal_relative_tolerance: 0.02            # fx/fy允许相对误差，0.02表示2%
  principal_point_tolerance_px: 5.0         # cx/cy允许误差，单位像素

#--------------------------------------depth-------------------------------------#
depth:                                      # 深度与3D反投影
  min_depth_m: 0.30                         # 最小有效深度，单位米
  max_depth_m: 6.00                         # 最大有效深度，单位米
  window_size: 5                            # 关键点深度中值窗口边长，必须为正奇数
  min_valid_samples: 3                      # 窗口内最少有效深度像素数

#--------------------------------------pose-------------------------------------#
pose:                                       # 人体基础观测质量，不是姿态评分
  min_keypoint_conf: 0.50                   # 2D关键点参与3D反投影的最低置信度
  min_valid_3d_keypoints: 4                 # 可靠人体至少需要的3D关键点数量
  person_size_reference_px: 250.0           # 人框达到该高度时尺寸质量近似满分，单位像素
  near_distance_m: 5.0                      # 距离质量的理想近距离，单位米
  max_reliable_distance_m: 10.0              # 人体可靠测量最远距离，单位米
  min_data_quality: 0.45                    # 人体综合质量最低值
  quality_weights:                          # 综合数据质量权重，总和必须等于1
    pose_confidence: 0.20                   # 关键点平均置信度权重
    pose_coverage: 0.20                     # 有效2D关键点覆盖率权重
    depth_coverage: 0.25                    # 有效3D关键点覆盖率权重
    torso_coverage: 0.20                    # 肩部和髋部完整度权重
    person_size: 0.10                       # 人框尺寸权重
    distance: 0.05                          # 人与相机距离权重

#--------------------------------------pose_3d-------------------------------------#
pose_3d:                                    # pose_3D.py的三维人体角度
  min_keypoint_conf: 0.50                   # 3D肩/髋/膝/踝参与计算的最低Pose置信度
  history_length: 7                         # 3D角度中值滤波帧数
  min_vector_length_m: 0.08                 # 3D人体轴线最小长度，单位米
  allow_lower_body_fallback: true           # 肩部缺失时是否用髋到膝/踝回退计算
  angle_normal_deg: 30.0                    # 3D角度不超过此值时P3D为0；0°表示竖直
  angle_fall_deg: 60.0                      # 3D角度达到此值时P3D为1；90°表示水平

#--------------------------------------pose_2d-------------------------------------#
pose_2d:                                    # pose_2D.py：二维角度、人框比例与P2D子分
  min_keypoint_conf: 0.50                   # 2D肩/髋关键点最低置信度
  min_image_vector_length_px: 20.0          # 2D肩中心到髋中心连线最小长度，单位像素
  angle_fall_deg: 30.0                      # 2D人体线与x轴夹角不超过此值时角度风险为1
  angle_normal_deg: 60.0                    # 2D人体线与x轴夹角达到此值时角度风险为0
  bbox_ratio_normal: 0.50                   # 人框宽/高不超过此值时形状风险为0
  bbox_ratio_fall: 0.90                     # 人框宽/高达到此值时形状风险为1
  weights:                                  # P2D内部两项权重，总和必须等于1
    image_angle: 0.636364                   # 二维角度在P2D中的权重
    bbox_ratio: 0.363636                    # 人框宽高比在P2D中的权重

#--------------------------------------pose_fusion-------------------------------------#
pose_fusion:                                # 姿态维度P只融合两个已经算好的独立子分
  weights:                                  # P3D与P2D融合权重，总和必须等于1
    pose_3d: 0.45                           # 三维姿态子分P3D权重
    pose_2d: 0.55                           # 二维姿态子分P2D权重；保持原二维角度35%+人框20%

#--------------------------------------height_score-------------------------------------#
height_score:                               # height.py：高度维度H
  history_length: 120                       # 每个人最多保存的髋高历史条数
  baseline_window_s: 3.0                    # 最近多少秒用于寻找跌倒前最高髋高
  min_baseline_age_s: 0.30                  # 基准点至少早于当前多少秒
  drop_start_m: 0.15                        # 髋部下降达到该值开始得分，单位米
  drop_full_m: 0.50                         # 髋部下降达到该值记满分，单位米
  hip_height_normal_m: 0.55                 # 当前髋高达到该值时低高度分为0
  hip_height_fall_m: 0.25                   # 当前髋高低于该值时低高度分为1

#--------------------------------------velocity_score---------------------------------------#
velocity_score:                             # velocity.py：下降速度维度V
  history_length: 30                        # 每个人最多保存的短时髋高历史条数
  window_s: 0.35                            # 计算垂直速度的回看窗口，单位秒
  min_interval_s: 0.15                      # 两次高度测量最小时间间隔，单位秒
  normal_mps: 0.30                          # 向下速度不超过该值时风险为0，单位米/秒
  fall_mps: 0.80                            # 向下速度达到该值时风险为1，单位米/秒
  smoothing_alpha: 0.35                     # 速度平滑中新值占比，调大响应更快但更抖

#--------------------------------------static_score-------------------------------------#
static_score:                               # static.py：异常后静止维度S
  history_length: 30                        # 每个人最多保存的躯干中心历史条数
  motion_window_s: 0.40                     # 计算躯干3D速度的回看窗口，单位秒
  min_interval_s: 0.20                      # 两次中心测量最小时间间隔，单位秒
  motion_threshold_mps: 0.12                # 速度低于该值视为静止，单位米/秒
  start_s: 1.0                              # 异常后静止达到该时间开始得分
  full_s: 3.0                               # 异常后静止达到该时间记满分
  candidate_pose_score: 0.50                # P达到该值才允许累计静止时间
  candidate_height_score: 0.50              # H达到该值才允许累计静止时间

#--------------------------------------scene-------------------------------------#
scene:                                      # scene.py：人物场景关系与场景维度C
  target_class_map:                         # 模型类别名到系统场景名的映射
    bed: bed                                # 床
    couch: sofa                             # COCO把沙发命名为couch
    sofa: sofa                              # 兼容自训练sofa类别
    chair: chair                            # 椅子
  object_sample_step: 5                     # 家具Mask内Depth采样像素步长
  min_object_points: 15                     # 家具最少有效3D点数
  mask_threshold: 0.50                      # Seg像素属于家具的最低概率
  min_mask_area_px: 100                     # 最小家具Mask面积，单位像素
  object_x_margin_ratio: 0.15               # 家具框左右各忽略的边缘比例
  surface_bands:                            # 家具框内承载面纵向范围，0为顶部、1为底部
    bed: [0.20, 0.65]                       # 床面Depth采样范围
    sofa: [0.25, 0.70]                      # 沙发承载面Depth采样范围
    chair: [0.20, 0.65]                     # 椅子座面Depth采样范围
  relation:                                 # 人体与家具/地面的关系阈值
    min_iou: 0.03                           # 人框和家具框最低二维IoU辅助证据
    full_iou: 0.20                          # IoU达到该值时IoU子分记满
    on_distance_m: 0.40                     # 人体到家具小于该距离视为可能接触
    near_distance_m: 0.80                   # 人体到家具小于该距离视为靠近
    surface_height_tolerance_m: 0.30        # 髋高与家具表面高度最大允许差
    floor_hip_height_m: 0.22                # 髋高低于该值可支持躺在地面
    standing_angle_max_deg: 35.0            # 3D角度低于该值视为竖直
    lying_angle_min_deg: 55.0               # 3D角度高于该值视为水平
    confidence_weights:                     # 场景关系置信度权重，总和必须为1
      iou: 0.35                             # 二维重叠权重
      distance: 0.35                        # 三维距离权重
      height: 0.30                          # 表面高度一致性权重
    floor_confidence_weights:               # 地面关系置信度权重，总和必须为1
      angle: 0.50                           # 水平角度权重
      height: 0.50                          # 低髋高权重
  confidence_threshold: 0.55                # 多帧关系低于该置信度时输出unknown
  history_length: 10                        # 每个ID保存的场景关系帧数
  risk_scores:                              # C场景风险分，越接近1越支持跌倒
    floor: 1.0                              # 躺在地面
    bed: 0.0                                # 躺在床上
    sofa: 0.1                               # 躺在沙发上
    chair: 0.0                              # 坐在或靠近椅子
    wheelchair: 0.0                         # 预留轮椅场景
    unknown: 0.5                            # 场景无法确定

#--------------------------------------fall_detector-------------------------------------#
fall_detector:                              # fall_detector.py：只做五项加权和二值状态机
  history_length: 120                       # 每个人保存的总分历史条数
  weights:                                  # FallScore五项权重，总和必须等于1
    pose: 0.30                              # P姿态维度
    height: 0.25                            # H高度维度
    velocity: 0.20                          # V下降速度维度
    static: 0.15                            # S异常后静止维度
    scene: 0.10                             # C场景维度
  state_machine:                            # 只输出FALL/NO_FALL
    trigger_score: 0.65                     # 总分达到该值才进入确认计时
    release_score: 0.35                     # 总分降到该值以下才允许恢复
    confirm_duration_s: 1.0                 # 跌倒证据连续保持时间，单位秒
    recover_duration_s: 2.0                 # 恢复证据连续保持时间，单位秒
    transient_evidence_hold_s: 3.0          # 下降/速度瞬态证据保留时间
    transient_height_score: 0.50            # H达到该值时锁存瞬态证据
    transient_velocity_score: 0.50          # V达到该值时锁存瞬态证据
    min_pose_score: 0.50                    # 确认FALL所需最低P
    min_height_score: 0.45                  # 确认FALL所需最低H，或使用已锁存瞬态证据
    min_data_quality: 0.45                  # 进入状态机的最低人体数据质量
    recover_angle_deg: 30.0                 # 3D人体角度恢复到该值以下才视为直立
    recover_hip_height_m: 0.45              # 髋高恢复到该值以上才视为站起
    allow_2d_only_fall: true                # Depth完全失效时，是否允许只靠P2D继续确认跌倒
    degraded_min_available_weight: 0.30     # 降级判断至少要有多少原始维度权重，0.30允许只有P
    degraded_min_pose_score: 0.85           # 纯2D降级确认所需最低姿态风险，比普通模式更严格
    degraded_trigger_score: 0.80            # 有效维度重新归一化后，降级总分触发阈值
    degraded_confirm_duration_s: 2.0        # 纯2D高风险连续多久才确认FALL，单位秒
    degraded_recover_pose_score: 0.25       # 3D仍缺失时，P2D低于该值才允许解除FALL
    degraded_recover_duration_s: 3.0        # 纯2D恢复证据连续多久才解除FALL，单位秒
    stale_person_s: 5.0                     # ID离开画面后清空全部历史的时间

#--------------------------------------ai-------------------------------------#
ai:                                         # ai_verifier.py：事件触发的豆包异步复核
  enabled: true                             # 是否启用AI；关闭或缺少密钥时本地检测仍正常运行
  provider: volcengine_ark                  # AI服务提供方标识，为后续更换服务预留
  base_url: https://ark.cn-beijing.volces.com/api/v3  # 火山方舟兼容OpenAI的API根地址
   # API密钥环境变量名，密钥本身绝不能写入本文件  终端运行 ,  $env:ARK_API_KEY="你的API密钥"
  api_key_env: ARK_API_KEY                 
  model: doubao-seed-evolving              # 当前文本模型；只读取本地结构化检测数据
  supports_vision: true                     # 当前模型不能看图；以后换视觉模型时改为true
  request:                                  # 单次网络请求和后台任务参数
    timeout_s: 5.0                          # 请求最长等待时间，超时后立即退回本地判断
    max_tokens: 500                         # AI结构化回答最大Token数
    temperature: 0.0                        # 0表示回答更稳定，适合固定JSON判断任务
    force_json_response: false              # 是否发送JSON响应格式参数；旧模型不支持时保持false
    max_workers: 1                          # 后台AI线程数，1可避免同时请求过多占用带宽
    max_pending_requests: 2                 # 最多允许多少个未完成请求，队列满时跳过新请求
  trigger:                                  # 哪些本地事件需要调用AI，不采用固定每秒上传
    fall_score: 0.45                        # 本地总分达到该值后开始积累AI触发帧
    min_pose_score: 0.50                    # AI触发还要求P至少达到该值
    min_data_quality: 0.35                  # 数据质量低于该值时不浪费AI请求
    consecutive_frames: 3                   # 疑似风险连续多少帧后提交；本地FALL可立即提交
    cooldown_s: 5.0                         # 同一人员两次AI请求的最小间隔，单位秒
    fall_recheck_s: 20.0                    # 本地已确认FALL后的AI重复复核间隔，单位秒
    result_ttl_s: 15.0                      # AI结果最多参与融合多久，单位秒
  buffer:                                   # 每个人的短时事件缓冲区
    duration_s: 5.0                         # 保存触发前后最近多少秒的数据
    sample_interval_s: 0.50                 # 缓冲采样间隔；0.5表示约每秒保存2条
    max_frames_per_person: 12               # 每个Track ID最多保存多少条观测
    keyframe_count: 4                       # 一次AI复核选择多少个时间点
    crop_margin_ratio: 0.20                 # 视觉模型人体裁剪框四周额外保留的比例
    jpeg_quality: 80                        # 视觉模型JPEG压缩质量，越高越清晰但上传更大
  network:                                  # 网络失败后的指数退避，避免断网时不断重试
    backoff_initial_s: 3.0                  # 第一次失败后暂停请求时间，单位秒
    backoff_max_s: 60.0                     # 连续失败时最长暂停时间，单位秒
  fusion:                                   # decision_fusion.py：本地和AI最终融合规则
    min_ai_fall_confidence: 0.80            # AI辅助确认FALL所需最低置信度
    text_min_local_score: 0.55              # 文本AI只复核本地数据，因此要求较高本地总分
    vision_min_local_score: 0.40            # 视觉AI具有独立图像证据时允许较低本地总分
    min_local_pose_score: 0.55              # AI辅助确认仍要求本地姿态P明显异常
    min_local_data_quality: 0.35            # AI不能放大质量过低的本地误测
    positive_hold_s: 15.0                   # AI辅助确认后保持FALL的时间，单位秒

#--------------------------------------alerts-------------------------------------#
alerts:                                     # alert_manager.py：后续机器人动作和通知统一入口
  enabled: true                             # 是否生成最终FALL和恢复事件
  console_enabled: true                     # 当前是否在终端打印告警；不会自动控制机器人

#--------------------------------------display-------------------------------------#
display:                                    # OpenCV可视化
  enabled: true                             # 是否打开窗口
  window_names:                             # 各文件单独测试的窗口标题
    pose_3d: Pose 3D Test                    # 三维姿态角测试窗口
    pose_2d: Pose 2D Score Test              # 二维姿态角、人框比例和P测试窗口
    height: Height Score Test                # H高度维度
    velocity: Velocity Score Test            # V下降速度维度
    static: Static Score Test                # S静止维度
    scene: Scene Score Test                  # C场景维度
    fall_detector: Fall Detector Test        # 五项加权与状态机
    ai: Doubao AI Verification Test          # 本地检测、豆包复核和融合结果测试窗口
    full: Fall Detection Full Pipeline       # 完整流程
  show_keypoints: true                      # 是否显示人体2D关键点
  show_pose_2d_axis: true                   # 是否显示肩中心—髋中心线及水平x轴参考线
  show_scene_objects: true                  # 是否显示家具检测框
  show_scene_masks: true                    # 是否显示家具Mask
  scene_mask_alpha: 0.35                    # 家具Mask透明度
  font_scale: 0.50                          # 主标签字体大小
  line_height_px: 18                        # 数据文字行距，单位像素
