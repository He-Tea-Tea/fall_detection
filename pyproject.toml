[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-detection"
version = "0.96.0"
description = "RGB-D fall detection pipeline with local scoring and optional vision AI verification"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["fall_detection*"]
